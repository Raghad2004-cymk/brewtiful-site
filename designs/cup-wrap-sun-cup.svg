<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1206 1206" width="1206" height="1206">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Patrick+Hand&amp;display=swap');
      .hand { font-family: 'Patrick Hand', 'Comic Sans MS', cursive; }
      .ink { fill: none; stroke: #1d1f4a; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .thin { fill: none; stroke: #1d1f4a; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .cheek { fill: none; stroke: #d9343f; stroke-width: 2.5; stroke-linecap: round; }
    </style>
    <path id="titleArc" d="M102,450 A1700 1700 0 0 1 1102,450"/>
    <path id="subArc" d="M182,905 A1556 1556 0 0 1 1022,905"/>
    <symbol id="sparkle" viewBox="-10 -10 20 20">
      <path d="M0,-10 Q1.5,-1.5 10,0 Q1.5,1.5 0,10 Q-1.5,1.5 -10,0 Q-1.5,-1.5 0,-10Z"/>
    </symbol>
  </defs>

  <rect width="1206" height="1206" fill="#ffffff"/>

  <!-- قالب الكوب (شكل القوس) -->
  <path d="M40,375 A1710 1710 0 0 1 1165,375 L1030,930 A1556 1556 0 0 0 175,930 Z"
        fill="#ffffff" stroke="#cfcac4" stroke-width="2"/>

  <!-- العنوان -->
  <text class="hand" font-size="78" fill="#1d1f4a" text-anchor="middle" letter-spacing="1">
    <textPath href="#titleArc" startOffset="50%">Made by Memi</textPath>
  </text>

  <!-- نقاط ونجوم صغيرة -->
  <g fill="#f07aa8">
    <circle cx="352" cy="560" r="4"/><circle cx="560" cy="470" r="4"/><circle cx="880" cy="520" r="4"/>
    <circle cx="372" cy="680" r="4"/><circle cx="612" cy="690" r="5"/><circle cx="850" cy="680" r="4"/>
    <circle cx="590" cy="520" r="3"/><circle cx="905" cy="610" r="3"/>
  </g>
  <g fill="#6b7cc9">
    <circle cx="330" cy="610" r="4"/><circle cx="545" cy="500" r="4"/><circle cx="640" cy="450" r="5"/>
    <circle cx="585" cy="720" r="4"/><circle cx="660" cy="660" r="4"/><circle cx="870" cy="560" r="3"/>
  </g>
  <use href="#sparkle" x="385" y="455" width="26" height="26" fill="#6b7cc9"/>
  <use href="#sparkle" x="855" y="440" width="24" height="24" fill="#f07aa8"/>
  <use href="#sparkle" x="575" y="615" width="22" height="22" fill="#f07aa8"/>
  <use href="#sparkle" x="870" y="625" width="26" height="26" fill="#6b7cc9"/>
  <use href="#sparkle" x="330" y="500" width="18" height="18" fill="#f07aa8"/>

  <!-- ===== الشخصية الأولى: الشمس ===== -->
  <g>
    <!-- أشعة -->
    <g fill="#fdd94a" stroke="#1d1f4a" stroke-width="3" stroke-linejoin="round">
      <path d="M470,442 l13,34 h-26 z" transform="rotate(0 470 560)"/>
      <path d="M470,442 l13,34 h-26 z" transform="rotate(45 470 560)"/>
      <path d="M470,442 l13,34 h-26 z" transform="rotate(90 470 560)"/>
      <path d="M470,442 l13,34 h-26 z" transform="rotate(135 470 560)"/>
      <path d="M470,442 l13,34 h-26 z" transform="rotate(180 470 560)"/>
      <path d="M470,442 l13,34 h-26 z" transform="rotate(225 470 560)"/>
      <path d="M470,442 l13,34 h-26 z" transform="rotate(270 470 560)"/>
      <path d="M470,442 l13,34 h-26 z" transform="rotate(315 470 560)"/>
    </g>
    <!-- الجسم مع ظل لوني مزاح -->
    <circle cx="477" cy="566" r="88" fill="#f9c933"/>
    <circle cx="470" cy="560" r="86" fill="#fdd94a" stroke="#1d1f4a" stroke-width="4"/>
    <!-- الوجه -->
    <path class="thin" d="M438,548 q10,8 20,0"/>
    <path class="thin" d="M482,548 q10,8 20,0"/>
    <path class="thin" d="M455,578 q15,14 30,0"/>
    <path class="cheek" d="M422,572 a6,6 0 1 1 6,6 a3,3 0 1 1 -3,-3"/>
    <path class="cheek" d="M502,572 a6,6 0 1 1 6,6 a3,3 0 1 1 -3,-3"/>
    <!-- الذراع اليسرى -->
    <path class="thin" d="M392,600 L345,628 M345,628 l-10,-8 M345,628 l-12,2 M345,628 l-4,12"/>
    <!-- الذراع اليمنى نحو القلب -->
    <path class="thin" d="M548,595 Q575,600 598,598"/>
    <!-- الأرجل -->
    <path class="thin" d="M445,642 L442,712 M495,642 L498,712"/>
    <!-- أحذية وردية -->
    <g>
      <path d="M432,708 h22 v28 h12 q6,0 6,7 v8 h-42 z" fill="#f07aa8" transform="translate(-4,3)"/>
      <path d="M430,708 h22 v28 h12 q6,0 6,7 v8 h-40 z" fill="#f7a3c4" stroke="#1d1f4a" stroke-width="3" stroke-linejoin="round"/>
      <path d="M438,724 c-3,-5 3,-7 4,-3 c1,-4 7,-2 4,3 l-4,4z" fill="#d9343f"/>
      <path d="M486,708 h22 v28 h12 q6,0 6,7 v8 h-42 z" fill="#f07aa8" transform="translate(-4,3)"/>
      <path d="M486,708 h22 v28 h12 q6,0 6,7 v8 h-40 z" fill="#f7a3c4" stroke="#1d1f4a" stroke-width="3" stroke-linejoin="round"/>
      <path d="M494,724 c-3,-5 3,-7 4,-3 c1,-4 7,-2 4,3 l-4,4z" fill="#d9343f"/>
    </g>
  </g>

  <!-- القلب الصغير بين اليدين -->
  <path d="M603,612 C580,596 586,578 598,582 C602,583 603,587 603,589 C604,586 606,582 611,582 C622,582 624,598 603,612Z"
        fill="#c8283a" stroke="#1d1f4a" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- ===== الشخصية الثانية: كوب القهوة ===== -->
  <g>
    <!-- بخار -->
    <path d="M705,447 q-10,-11 0,-22 q10,-11 0,-22" fill="none" stroke="#6b7cc9" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M745,442 q-10,-11 0,-22 q10,-11 0,-22" fill="none" stroke="#f07aa8" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M785,447 q-10,-11 0,-22 q10,-11 0,-22" fill="none" stroke="#6b7cc9" stroke-width="3.5" stroke-linecap="round"/>
    <!-- المقبض -->
    <path d="M832,505 q48,-4 46,44 q-2,46 -58,52" fill="none" stroke="#f07aa8" stroke-width="16" stroke-linecap="round"/>
    <path d="M832,505 q48,-4 46,44 q-2,46 -58,52" class="ink"/>
    <!-- الجسم مع ظل مزاح -->
    <path d="M660,474 L842,474 L818,656 Q750,672 684,656 Z" fill="#f07aa8"/>
    <path d="M652,466 L836,466 L812,648 Q744,664 676,648 Z" fill="#f78fb8" stroke="#1d1f4a" stroke-width="4" stroke-linejoin="round"/>
    <!-- الحافة والرغوة -->
    <ellipse cx="744" cy="466" rx="92" ry="18" fill="#fff4e6" stroke="#1d1f4a" stroke-width="4"/>
    <ellipse cx="744" cy="468" rx="74" ry="11" fill="#c98b5a"/>
    <path d="M744,476 C732,468 734,460 740,461 C742,461 744,463 744,464 C745,462 746,460 749,460 C755,460 756,468 744,476Z" fill="#fff4e6"/>
    <!-- الوجه -->
    <path class="thin" d="M705,538 q10,8 20,0"/>
    <path class="thin" d="M762,538 q10,8 20,0"/>
    <path class="thin" d="M728,566 q15,14 30,0"/>
    <path class="cheek" d="M688,560 a6,6 0 1 1 6,6 a3,3 0 1 1 -3,-3"/>
    <path class="cheek" d="M782,560 a6,6 0 1 1 6,6 a3,3 0 1 1 -3,-3"/>
    <!-- الذراع اليسرى نحو القلب -->
    <path class="thin" d="M664,585 Q635,596 608,598"/>
    <!-- الذراع اليمنى -->
    <path class="thin" d="M824,615 L885,640 M885,640 l4,-12 M885,640 l12,2 M885,640 l6,10"/>
    <!-- الأرجل -->
    <path class="thin" d="M715,656 L712,712 M775,656 L778,712"/>
    <!-- أحذية صفراء -->
    <g>
      <path d="M702,708 h22 v28 h12 q6,0 6,7 v8 h-42 z" fill="#f9c933" transform="translate(-4,3)"/>
      <path d="M700,708 h22 v28 h12 q6,0 6,7 v8 h-40 z" fill="#fdd94a" stroke="#1d1f4a" stroke-width="3" stroke-linejoin="round"/>
      <path d="M708,724 c-3,-5 3,-7 4,-3 c1,-4 7,-2 4,3 l-4,4z" fill="#d9343f"/>
      <path d="M766,708 h22 v28 h12 q6,0 6,7 v8 h-42 z" fill="#f9c933" transform="translate(-4,3)"/>
      <path d="M766,708 h22 v28 h12 q6,0 6,7 v8 h-40 z" fill="#fdd94a" stroke="#1d1f4a" stroke-width="3" stroke-linejoin="round"/>
      <path d="M774,724 c-3,-5 3,-7 4,-3 c1,-4 7,-2 4,3 l-4,4z" fill="#d9343f"/>
    </g>
  </g>

  <!-- النص السفلي -->
  <text class="hand" font-size="44" fill="#8e1f2b" text-anchor="middle">
    <textPath href="#subArc" startOffset="50%">(brewed with love for my favorite teachers)</textPath>
  </text>
</svg>
